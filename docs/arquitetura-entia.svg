<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura de referência do ENT.IA</title>
  <desc id="description">Diagrama das zonas pública, de borda e interna, incluindo React, proxy e WAF, BFF e API REST, monólito modular, Keycloak, PostgreSQL, orquestrador de IA e provedor de LLM.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a69c"/>
      <stop offset="1" stop-color="#4edbd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#49657a"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#00a69c"/>
    </marker>
    <style>
      .zone { fill:#fff; stroke:#cfdae5; stroke-width:2; }
      .zone-private { fill:#f3f7fa; stroke:#adc1d1; stroke-width:2; stroke-dasharray:10 7; }
      .box { fill:#fff; stroke:#b7c9d8; stroke-width:2; filter:url(#shadow); }
      .box-core { fill:#e5f7f5; stroke:#00a69c; stroke-width:3; filter:url(#shadow); }
      .box-external { fill:#fff0ed; stroke:#ff8379; stroke-width:2; filter:url(#shadow); }
      .box-data { fill:#edf2f8; stroke:#7693aa; stroke-width:2; filter:url(#shadow); }
      .title { fill:#071a2d; font:800 42px Inter,system-ui,sans-serif; letter-spacing:-1px; }
      .subtitle { fill:#55667a; font:500 20px Inter,system-ui,sans-serif; }
      .zone-label { fill:#00a69c; font:800 16px Inter,system-ui,sans-serif; letter-spacing:2px; }
      .label { fill:#102033; font:800 20px Inter,system-ui,sans-serif; text-anchor:middle; }
      .small { fill:#55667a; font:500 15px Inter,system-ui,sans-serif; text-anchor:middle; }
      .module { fill:#fff; stroke:#9bcfc9; stroke-width:1.5; }
      .module-risk { fill:#fff7f5; stroke:#ff9a92; stroke-width:1.5; }
      .module-label { fill:#173047; font:700 13px Inter,system-ui,sans-serif; text-anchor:middle; }
      .arrow { fill:none; stroke:#49657a; stroke-width:3; marker-end:url(#arrow); }
      .arrow-bi { fill:none; stroke:#49657a; stroke-width:3; marker-start:url(#arrow); marker-end:url(#arrow); }
      .arrow-trust { fill:none; stroke:#00a69c; stroke-width:3.5; marker-end:url(#arrowTeal); }
      .dashed { stroke-dasharray:8 6; }
      .flow { fill:#425d72; font:600 13px Inter,system-ui,sans-serif; text-anchor:middle; }
      .note { fill:#fff; font:700 14px Inter,system-ui,sans-serif; }
      .note-small { fill:#b8cad9; font:500 13px Inter,system-ui,sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="0" y="0" width="1600" height="9" fill="url(#brand)"/>
  <text class="title" x="72" y="72">ENT.IA · Arquitetura de referência</text>
  <text class="subtitle" x="72" y="106">Metadados como contrato central · segurança contextual · IA mediada por APIs REST</text>

  <rect class="zone" x="60" y="145" width="255" height="605" rx="22"/>
  <text class="zone-label" x="85" y="180">ACESSO PÚBLICO</text>
  <rect class="box" x="95" y="220" width="185" height="105" rx="16"/>
  <text class="label" x="188" y="261">React SPA</text>
  <text class="small" x="188" y="288">UI dinâmica</text>
  <text class="small" x="188" y="309">sem tokens no browser</text>
  <rect class="box" x="95" y="405" width="185" height="105" rx="16"/>
  <text class="label" x="188" y="446">Usuário</text>
  <text class="small" x="188" y="473">sessão + organização</text>
  <text class="small" x="188" y="494">selecionada</text>

  <rect class="zone" x="345" y="145" width="245" height="605" rx="22"/>
  <text class="zone-label" x="370" y="180">BORDA SEGURA</text>
  <rect class="box-data" x="380" y="250" width="175" height="135" rx="16"/>
  <text class="label" x="468" y="292">Proxy / WAF</text>
  <text class="small" x="468" y="321">TLS · rate limiting</text>
  <text class="small" x="468" y="344">headers confiáveis</text>
  <text class="small" x="468" y="367">rotas mínimas</text>
  <rect x="380" y="455" width="175" height="88" rx="14" fill="#d9f3f0" stroke="#00a69c" stroke-width="2"/>
  <text class="label" x="468" y="490">auth.ent.ia.br</text>
  <text class="small" x="468" y="518">somente frontchannel</text>

  <rect class="zone-private" x="620" y="145" width="915" height="605" rx="22"/>
  <text class="zone-label" x="645" y="180">REDE INTERNA / SERVIÇOS CONFIÁVEIS</text>

  <rect class="box-core" x="660" y="205" width="555" height="355" rx="20"/>
  <text class="label" x="938" y="243">ENT.IA · Spring Boot modular monolith</text>
  <rect x="700" y="267" width="475" height="62" rx="13" fill="url(#brand)"/>
  <text x="938" y="294" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="800" text-anchor="middle">BFF + REST API + autorização contextual</text>
  <text x="938" y="315" fill="#eafffd" font-family="Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">fronteira única para UI, integrações e IA</text>

  <rect class="module" x="700" y="357" width="104" height="55" rx="10"/>
  <text class="module-label" x="752" y="390">Identity</text>
  <rect class="module" x="816" y="357" width="104" height="55" rx="10"/>
  <text class="module-label" x="868" y="390">Tenancy</text>
  <rect class="module" x="932" y="357" width="104" height="55" rx="10"/>
  <text class="module-label" x="984" y="390">Authorization</text>
  <rect class="module-risk" x="1048" y="357" width="127" height="55" rx="10"/>
  <text class="module-label" x="1112" y="390">Catalog</text>

  <rect class="module-risk" x="700" y="426" width="145" height="55" rx="10"/>
  <text class="module-label" x="773" y="459">Schema Engine</text>
  <rect class="module-risk" x="857" y="426" width="145" height="55" rx="10"/>
  <text class="module-label" x="930" y="459">Dynamic Records</text>
  <rect class="module" x="1014" y="426" width="161" height="55" rx="10"/>
  <text class="module-label" x="1095" y="459">Dynamic API</text>

  <rect class="module" x="700" y="495" width="145" height="45" rx="10"/>
  <text class="module-label" x="773" y="523">Audit</text>
  <rect class="module-risk" x="857" y="495" width="145" height="45" rx="10"/>
  <text class="module-label" x="930" y="523">AI Orchestration</text>
  <rect class="module" x="1014" y="495" width="161" height="45" rx="10"/>
  <text class="module-label" x="1095" y="523">Observability</text>

  <rect class="box-external" x="1260" y="215" width="225" height="115" rx="16"/>
  <text class="label" x="1373" y="254">Keycloak</text>
  <text class="small" x="1373" y="281">realm ent-ia</text>
  <text class="small" x="1373" y="304">OIDC / SAML / social</text>

  <rect class="box-data" x="680" y="620" width="300" height="92" rx="16"/>
  <text class="label" x="830" y="654">PostgreSQL · aplicação</text>
  <text class="small" x="830" y="680">catálogo + auditoria + tabelas por entidade</text>
  <text class="small" x="830" y="702">organization_id obrigatório</text>

  <rect class="box-data" x="1030" y="620" width="205" height="92" rx="16"/>
  <text class="label" x="1133" y="654">Dados Keycloak</text>
  <text class="small" x="1133" y="680">logicamente separados</text>
  <text class="small" x="1133" y="702">sem senhas no ENT.IA</text>

  <rect class="box-external" x="1280" y="605" width="205" height="107" rx="16"/>
  <text class="label" x="1383" y="643">Provedor LLM</text>
  <text class="small" x="1383" y="670">modelo a decidir</text>
  <text class="small" x="1383" y="693">sem acesso ao banco</text>

  <path class="arrow-bi" d="M280 272 L380 300"/>
  <text class="flow" x="329" y="270">HTTPS</text>
  <path class="arrow-trust" d="M555 315 L660 315"/>
  <text class="flow" x="607" y="296">app / API</text>
  <path class="arrow" d="M555 490 C610 490 602 285 660 285"/>
  <text class="flow" x="603" y="430">callback BFF</text>
  <path class="arrow" d="M555 490 C760 590 1160 480 1260 285"/>
  <text class="flow" x="934" y="580">frontchannel público limitado</text>
  <path class="arrow-bi" d="M1215 285 L1260 285"/>
  <text class="flow" x="1237" y="267">OIDC</text>
  <path class="arrow-bi" d="M830 560 L830 620"/>
  <text class="flow" x="894" y="597">jOOQ / SQL</text>
  <path class="arrow-bi" d="M1133 330 L1133 620"/>
  <text class="flow" x="1194" y="590">persistência</text>
  <path class="arrow-bi dashed" d="M1002 518 C1170 520 1190 650 1280 650"/>
  <text class="flow" x="1165" y="537">tool calling</text>

  <rect x="60" y="790" width="1475" height="72" rx="16" fill="#071a2d"/>
  <circle cx="96" cy="826" r="13" fill="#4edbd1"/>
  <text class="note" x="122" y="820" fill="#fff">1. Contexto confiável vem da sessão</text>
  <text class="note-small" x="122" y="842" fill="#b8cad9">organization_id nunca é aceito como autoridade do prompt ou payload</text>
  <circle cx="570" cy="826" r="13" fill="#4edbd1"/>
  <text class="note" x="596" y="820" fill="#fff">2. REST repete autorização</text>
  <text class="note-small" x="596" y="842" fill="#b8cad9">inclusive para interface, integrações e operações solicitadas pela IA</text>
  <circle cx="1071" cy="826" r="13" fill="#ff8379"/>
  <text class="note" x="1097" y="820" fill="#fff">3. IA sem caminho privilegiado</text>
  <text class="note-small" x="1097" y="842" fill="#b8cad9">sem SQL livre; escrita exige preview, confirmação e auditoria</text>
</svg>
